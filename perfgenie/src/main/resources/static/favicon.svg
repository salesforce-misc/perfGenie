<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A7BBF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bgGradient)"/>
  
  <!-- Target circles -->
  <g transform="translate(32, 32)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="white" stroke-width="2.5" opacity="0.9"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.95"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#fbbf24"/>
  </g>
</svg>
